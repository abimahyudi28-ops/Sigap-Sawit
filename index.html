    // ROOT APP
    function App() {
      const [activeMenu, setActiveMenu] = useState('dashboard');
      const [userRole, setUserRole] = useState('Admin');
      const [selectedBlockCode, setSelectedBlockCode] = useState('A01');
      
      const [blocksData, setBlocksData] = useState(INITIAL_BLOCKS_GEOJSON);

      // Filters for Map Page
      const [mapAfdelingFilter, setMapAfdelingFilter] = useState('Semua');
      const [mapLayerMode, setMapLayerMode] = useState('status_panen');
      const [activeBasemap, setActiveBasemap] = useState('osm');

      // TOUR DEMO SIMULATOR STATE (AUTO-PLAYING INTERACTIVE DEMO)
      const [isTourActive, setIsTourActive] = useState(false);
      const [tourStep, setTourStep] = useState(0);

      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const detailMapRef = useRef(null);
      const detailMapInstanceRef = useRef(null);

      // Safe Navigation Handler
      const handleNavigateToBlock = (code) => {
        if (!code) return;
        setSelectedBlockCode(code);
        setActiveMenu('detail-blok');
      };

      useEffect(() => {
        window.openBlockDetail = (code) => {
          handleNavigateToBlock(code);
        };
      }, []);

      // AUTOMATIC INTERACTIVE TOUR SIMULATOR LOGIC (SIMULATES A PLAYING DEMO VIDEO FOR DOSEN)
      useEffect(() => {
        let timer;
        if (isTourActive) {
          timer = setInterval(() => {
            setTourStep((prevStep) => {
              const nextStep = (prevStep + 1) % 5;
              if (nextStep === 0) {
                setActiveMenu('dashboard');
              } else if (nextStep === 1) {
                setActiveMenu('map');
                setMapLayerMode('status_panen');
                setSelectedBlockCode('A02');
              } else if (nextStep === 2) {
                setActiveMenu('map');
                setMapLayerMode('tahun_tanam');
                setSelectedBlockCode('B01');
              } else if (nextStep === 3) {
                setSelectedBlockCode('A04');
                setActiveMenu('detail-blok');
              } else if (nextStep === 4) {
                setActiveMenu('laporan');
              }
              return nextStep;
            });
          }, 4000); // Advances step every 4 seconds
        }
        return () => clearInterval(timer);
      }, [isTourActive]);

      // LEAFLET MAP MAIN PAGE
      useEffect(() => {
        if (activeMenu === 'map' && mapRef.current) {
          const L = window.L;
          if (!L) return;

          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }

          const map = L.map(mapRef.current, { zoomControl: false, maxZoom: 18, minZoom: 10 }).setView([0.522, 101.445], 13.5);
          L.control.zoom({ position: 'topright' }).addTo(map);

          let tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
          if (activeBasemap === 'satellite') {
            tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
          } else if (activeBasemap === 'dark') {
            tileUrl = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
          }

          L.tileLayer(tileUrl, { maxZoom: 19 }).addTo(map);

          const filteredFeatures = blocksData.features.filter((f) => {
            if (mapAfdelingFilter !== 'Semua' && f.properties.afdeling !== mapAfdelingFilter) return false;
            return true;
          });

          const geoLayer = L.geoJSON({ type: "FeatureCollection", features: filteredFeatures }, {
            style: (feature) => {
              const p = feature.properties;
              let col = getProductivityColor(p.produktivitas);

              if (mapLayerMode === 'tahun_tanam') col = getAgeColor(p.umur_tanaman);
              else if (mapLayerMode === 'status_panen') col = getHarvestStatusColor(p.status_panen);
              
              const isSelected = p.kode_blok === selectedBlockCode;
              return {
                fillColor: col,
                weight: isSelected ? 4 : 2,
                color: isSelected ? '#fbbf24' : '#0f172a',
                fillOpacity: isSelected ? 0.9 : 0.75
              };
            },
            onEachFeature: (feature, layer) => {
              const p = feature.properties;
              
              let labelText = `<b>BLOK ${p.kode_blok}</b>`;
              if (mapLayerMode === 'tahun_tanam') labelText += `<br/>${p.tahun_tanam} (${p.umur_tanaman} thn)`;
              else if (mapLayerMode === 'status_panen') labelText += `<br/>${p.status_panen}`;
              else labelText += `<br/>${p.produktivitas} Ton/Ha`;

              layer.bindTooltip(labelText, {
                permanent: true,
                direction: 'center',
                className: 'font-mono text-xs font-extrabold bg-slate-950/90 text-white px-2 py-1 rounded-lg border border-emerald-500 shadow-lg'

                            <th className="p-3">Afdeling Tugas</th>
                            <th className="p-3">Target (Ton)</th>
                            <th className="p-3">Realisasi (Ton)</th>
                            <th className="p-3">Capaian (%)</th>
                            <th className="p-3">Status Target</th>
                            <th className="p-3">Analisis / Catatan</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800 text-slate-300">
                          {MANDOR_EVALUATION.map((m) => (
                            <tr key={m.id} className={`hover:bg-slate-800/60 ${m.status === 'TIDAK MEMENUHI TARGET' ? 'bg-red-950/20' : ''}`}>
                              <td className="p-3 font-bold text-white text-sm">{m.nama_mandor}</td>
                              <td className="p-3 font-semibold">{m.afdeling}</td>
                              <td className="p-3 font-mono">{m.target_ton} Ton</td>
                              <td className="p-3 font-mono font-bold text-white">{m.realisasi_ton} Ton</td>
                              <td className="p-3 font-mono font-bold text-emerald-400">{m.pencapaian_pct}%</td>
                              <td className="p-3">
                                <span className={`px-2.5 py-1 rounded-full text-[10px] font-extrabold ${
                                  m.status === 'MEMENUHI TARGET' ? 'bg-emerald-950 text-emerald-300 border border-emerald-700' : 'bg-red-950 text-red-400 border border-red-800'
                                }`}>
                                  {m.status === 'MEMENUHI TARGET' ? '🎯 MEMENUHI TARGET' : '⚠️ TIDAK MEMENUHI TARGET'}
                                </span>
                              </td>
                              <td className="p-3 text-[11px] text-slate-400">{m.catatan}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* MENU DATA BLOK, DATA TANAMAN, PANEN, HAMA */}
              {activeMenu === 'data-blok' && (
                <div className="space-y-4">
                  <h1 className="text-xl font-bold text-white">📋 Master Data Blok Perkebunan</h1>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead className="bg-slate-950 text-slate-400 border-b border-slate-800 uppercase text-[10px]">
                        <tr>
                          <th className="p-3">Kode Blok</th>
                          <th className="p-3">Afdeling</th>
                          <th className="p-3">Luas (Ha)</th>
                          <th className="p-3">Tanam (Umur)</th>
                          <th className="p-3">Status Panen</th>
                          <th className="p-3">Jumlah Pokok</th>
                          <th className="p-3">Produktivitas</th>
                          <th className="p-3 text-right">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300">
                        {blocksData.features.map((f) => {
                          const p = f.properties;
                          return (
                            <tr key={p.kode_blok} className="hover:bg-slate-800/50">
                              <td className="p-3 font-bold text-emerald-400">{p.kode_blok}</td>
                              <td className="p-3">{p.afdeling}</td>
                              <td className="p-3 font-semibold text-white">{p.luas} Ha</td>
                              <td className="p-3">{p.tahun_tanam} <span className="text-[10px] text-slate-400">({p.umur_tanaman} thn)</span></td>
                              <td className="p-3 font-bold" style={{ color: getHarvestStatusColor(p.status_panen) }}>{p.status_panen}</td>
                              <td className="p-3 font-mono">{p.jumlah_pokok.toLocaleString()}</td>
                              <td className="p-3"><span className={`px-2 py-0.5 rounded font-bold text-[11px] ${getProductivityBadgeClass(p.produktivitas)}`}>{p.produktivitas} Ton/Ha</span></td>
                              <td className="p-3 text-right">
                                <button onClick={() => handleNavigateToBlock(p.kode_blok)} className="px-2.5 py-1 bg-emerald-950 text-emerald-400 border border-emerald-700 rounded-lg font-bold text-[11px]">
                                  Detail Blok ➔
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activeMenu === 'data-tanaman' && (
                <div className="space-y-6">
                  <h1 className="text-xl font-bold text-white">🌱 Sensus & Distribusi Umur Tanaman Sawit</h1>
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3 text-xs">
                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl"><span className="text-slate-400 font-semibold block">0–3 Thn (TBM)</span><span className="text-2xl font-black text-blue-400">2 Blok</span></div>
                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl"><span className="text-slate-400 font-semibold block">4–7 Thn (TM Muda)</span><span className="text-2xl font-black text-emerald-400">4 Blok</span></div>
                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl"><span className="text-slate-400 font-semibold block">8–15 Thn (TM Prima)</span><span className="text-2xl font-black text-emerald-500">7 Blok</span></div>
                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl"><span className="text-slate-400 font-semibold block">16–20 Thn (TM Tua)</span><span className="text-2xl font-black text-amber-400">2 Blok</span></div>
                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl"><span className="text-slate-400 font-semibold block">&gt; 20 Thn (Renta)</span><span className="text-2xl font-black text-red-400">0 Blok</span></div>
                  </div>
                </div>
              )}

              {activeMenu === 'panen' && (
                <div className="space-y-6">
                  <h1 className="text-xl font-bold text-white">🚛 Monitoring Realisasi Panen TBS 15 Blok</h1>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="bg-slate-950 text-slate-400 border-b border-slate-800 uppercase text-[10px]">
                          <th className="p-3">Tanggal</th>
                          <th className="p-3">Kode Blok (Afdeling)</th>
                          <th className="p-3">Mandor Penanggung Jawab</th>
                          <th className="p-3">Tim Pemanen</th>
                          <th className="p-3">Hasil TBS (Kg)</th>
                          <th className="p-3">Produktivitas</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300">
                        {blocksData.features.map((f, i) => (
                          <tr key={f.properties.kode_blok} className="hover:bg-slate-800/50">
                            <td className="p-3 font-mono text-slate-400">2026-03-13</td>
                            <td className="p-3 font-bold text-emerald-400">
                              <button onClick={() => handleNavigateToBlock(f.properties.kode_blok)} className="hover:underline">
                                BLOK {f.properties.kode_blok} ({f.properties.afdeling})
                              </button>
                            </td>
                            <td className="p-3 font-semibold text-white">{i % 2 === 0 ? 'Subagyo Sastro' : 'Rudi Hermawan'}</td>
                            <td className="p-3 font-bold text-amber-400">Paiman & Tim {i + 1}</td>
                            <td className="p-3 font-bold text-white">{(f.properties.produksi / 40).toLocaleString()} Kg</td>
                            <td className="p-3 font-mono font-bold text-emerald-400">{f.properties.produktivitas * 50} Kg/Ha</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activeMenu === 'hama' && (
                <div className="space-y-6">
                  <h1 className="text-xl font-bold text-white">🐛 Monitoring & Pengendalian Hama (OPT)</h1>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    {blocksData.features.slice(0, 6).map((f) => (
                      <div key={f.properties.kode_blok} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-2">
                        <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                          <span className="font-extrabold text-white text-base">BLOK {f.properties.kode_blok} ({f.properties.afdeling})</span>
                          <span className="px-2.5 py-0.5 rounded font-bold bg-red-950 text-red-400 border border-red-800">Insiden Hama</span>
                        </div>
                        <p className="text-slate-300">Hama Utama: <b className="text-white">{f.properties.hama_terakhir || 'Ulat Api'}</b></p>
                        <button onClick={() => handleNavigateToBlock(f.properties.kode_blok)} className="px-3 py-1.5 bg-emerald-950 text-emerald-400 font-bold rounded-lg border border-emerald-800">
                          Buka Detail Blok {f.properties.kode_blok} ➔
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </main>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
